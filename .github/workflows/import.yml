name: import-poster-to-figma

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: "Name for the new Figma file"
        default: "Sidhi Maternal Deaths — 53 in a year (Sem 7)"
      team_hint:
        description: "Team/project to create the file in (fallback: Drafts)"
        default: "Semester 7"
      svg_file:
        description: "Poster SVG file in the repo to import"
        default: "sidhi_maternal_deaths.svg"
      verify_text:
        description: "Canvas text that proves the paste landed"
        default: "53 deaths"
      file_type:
        description: "'design' = Figma design file, 'figjam' = FigJam board"
        default: "design"
      board_url:
        description: "Existing board/file URL to open instead of creating new (optional)"
        default: ""
      rename_only:
        description: "With board_url: only rename, skip paste (true/false)"
        default: "false"
      inspect_title_menu:
        description: "With board_url: log the title dropdown menu items, no changes (true/false)"
        default: "false"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Import poster into Figma
        env:
          FIGMA_EMAIL: ${{ secrets.FIGMA_EMAIL }}
          FIGMA_PASSWORD: ${{ secrets.FIGMA_PASSWORD }}
        run: |
          ARGS=(--svg "${{ inputs.svg_file }}"
                --name "${{ inputs.file_name }}"
                --verify-text "${{ inputs.verify_text }}"
                --team-hint "${{ inputs.team_hint }}"
                --file-type "${{ inputs.file_type }}")
          if [ -n "${{ inputs.board_url }}" ]; then
            ARGS+=(--board-url "${{ inputs.board_url }}")
          fi
          if [ "${{ inputs.rename_only }}" = "true" ]; then
            ARGS+=(--rename-only)
          fi
          if [ "${{ inputs.inspect_title_menu }}" = "true" ]; then
            ARGS+=(--inspect-title-menu)
          fi
          python import_poster.py "${ARGS[@]}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-import-shots
          path: shots/

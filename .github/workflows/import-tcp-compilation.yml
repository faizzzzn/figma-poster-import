name: import-tcp-compilation-to-figma

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: "Name for the new Figma file"
        default: "TCP — ARID Research Compilation"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (Pillow, Playwright + Chromium)
        run: |
          pip install pillow playwright
          python -m playwright install chromium --with-deps

      - name: Generate TCP compilation artboards (title + 10 chapters, desktop)
        run: |
          python build_tcp_compilation_svg.py --out website_svg_tcp_compilation
          ls -la website_svg_tcp_compilation/

      - name: Import TCP compilation into Figma
        env:
          FIGMA_EMAIL: ${{ secrets.FIGMA_EMAIL }}
          FIGMA_PASSWORD: ${{ secrets.FIGMA_PASSWORD }}
          # fast viewport-pan placement (11 artboards); 0 = legacy nudge
          PASTE_STRIDE_PX: "2000"
        run: |
          python import_research.py \
            --svgs website_svg_tcp_compilation \
            --name "${{ inputs.file_name }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-tcp-compilation-import-shots
          path: shots/

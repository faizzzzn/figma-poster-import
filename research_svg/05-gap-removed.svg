<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2300" viewBox="0 0 1440 2300"><defs><linearGradient id="bg05gapremovedsvg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F4FAFF"/><stop offset="1" stop-color="#D8EBFB"/></linearGradient></defs>
<rect width="1440" height="2300" fill="url(#bg05gapremovedsvg)"/>
<rect x="90" y="90" width="403" height="48" rx="24.0" fill="rgba(255,255,255,0.6)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="118" y="118" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="4" fill="#14608F">04 — HOW THE GAP WAS REMOVED</text>
<text x="90" y="182" font-family="Fraunces, Georgia, serif" font-size="64" fill="#0B2E4E">From findings to design moves</text>
<text x="90" y="274" font-family="IBM Plex Mono, monospace" font-size="25" fill="#2C5A80">Each finding became a decision. Nothing decorative — every move answers</text>
<text x="90" y="312" font-family="IBM Plex Mono, monospace" font-size="25" fill="#2C5A80">something the field said.</text>
<rect x="90" y="400" width="1260" height="178" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<circle cx="140" cy="462" r="26" fill="#14608F"/>
<text x="140" y="471" font-family="Fraunces, Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="190" y="472.0" font-family="Fraunces, Georgia, serif" font-size="27" fill="#0B2E4E">A shared surface where need meets availability</text>
<text x="190" y="524.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">Instead of two private struggles, one public meeting point: kiosks at bus stands, auto</text>
<text x="190" y="554.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">spots and railway stations — exactly where workers already gather and wait.</text>
<rect x="90" y="604" width="1260" height="178" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<circle cx="140" cy="666" r="26" fill="#14608F"/>
<text x="140" y="675" font-family="Fraunces, Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="190" y="676.0" font-family="Fraunces, Georgia, serif" font-size="27" fill="#0B2E4E">Voice and icon first — no English, no typing required</text>
<text x="190" y="728.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">Hindi-first onboarding with Aadhaar scan + voice input. Speak the number or tap the</text>
<text x="190" y="758.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">numpad; icons carry the meaning where words would exclude.</text>
<rect x="90" y="808" width="1260" height="178" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<circle cx="140" cy="870" r="26" fill="#14608F"/>
<text x="140" y="879" font-family="Fraunces, Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="190" y="880.0" font-family="Fraunces, Georgia, serif" font-size="27" fill="#0B2E4E">Pay first, then everything else</text>
<text x="190" y="932.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">Job cards lead with the four things workers actually ask: pay per day, start time,</text>
<text x="190" y="962.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">distance, and rating — the text-heavy decision point, rebuilt.</text>
<rect x="90" y="1012" width="1260" height="178" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<circle cx="140" cy="1074" r="26" fill="#14608F"/>
<text x="140" y="1083" font-family="Fraunces, Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="190" y="1084.0" font-family="Fraunces, Georgia, serif" font-size="27" fill="#0B2E4E">Honest verification</text>
<text x="190" y="1136.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">Badges always state their source — “Verified hirer · checked by Kaam” — because trust is</text>
<text x="190" y="1166.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">borrowed from someone accountable, never assumed.</text>
<rect x="90" y="1216" width="1260" height="178" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<circle cx="140" cy="1278" r="26" fill="#14608F"/>
<text x="140" y="1287" font-family="Fraunces, Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="190" y="1288.0" font-family="Fraunces, Georgia, serif" font-size="27" fill="#0B2E4E">The job survives without a smartphone</text>
<text x="190" y="1340.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">Token code + SMS to a basic phone + printable slip. No app to install, no data needed —</text>
<text x="190" y="1370.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">the loop closes over the technology workers already have.</text>
<rect x="90" y="1420" width="1260" height="178" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<circle cx="140" cy="1482" r="26" fill="#14608F"/>
<text x="140" y="1491" font-family="Fraunces, Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="190" y="1492.0" font-family="Fraunces, Georgia, serif" font-size="27" fill="#0B2E4E">The referral’s last mile, built in</text>
<text x="190" y="1544.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">Requirements and how-to-reach are shown before acceptance — what to bring, whom to ask</text>
<text x="190" y="1574.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">for, how far it is. The system carries the context a referral used to carry.</text>
<rect x="90" y="1624" width="1260" height="178" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<circle cx="140" cy="1686" r="26" fill="#14608F"/>
<text x="140" y="1695" font-family="Fraunces, Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="190" y="1696.0" font-family="Fraunces, Georgia, serif" font-size="27" fill="#0B2E4E">Privacy on a public screen</text>
<text x="190" y="1748.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">Masked numbers, a visible privacy promise, session auto-wipe with an inactivity countdown</text>
<text x="190" y="1778.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">— so the first tap doesn’t feel like exposure.</text>
<rect x="90" y="1828" width="1260" height="178" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<circle cx="140" cy="1890" r="26" fill="#14608F"/>
<text x="140" y="1899" font-family="Fraunces, Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="190" y="1900.0" font-family="Fraunces, Georgia, serif" font-size="27" fill="#0B2E4E">Skills become visible tags</text>
<text x="190" y="1952.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">Sponsored Skill India / PMKVY courses complete into verified skill tags on the worker’s</text>
<text x="190" y="1982.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">profile — cooking, masonry, driving, housekeeping. Reputation stops being only stars; it</text>
<text x="190" y="2012.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">becomes provable skill.</text>
<rect x="90" y="2032" width="1260" height="178" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<circle cx="140" cy="2094" r="26" fill="#14608F"/>
<text x="140" y="2103" font-family="Fraunces, Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="190" y="2104.0" font-family="Fraunces, Georgia, serif" font-size="27" fill="#0B2E4E">Trust with a paper trail</text>
<text x="190" y="2156.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">Consent-based self-declaration of no criminal record, linked to the local police station</text>
<text x="190" y="2186.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">for verification — the check households already trust, now on record. Identity anchored to</text>
<text x="190" y="2216.5" font-family="IBM Plex Mono, monospace" font-size="20" fill="#2C5A80">e-Shram (Ministry of Labour &amp; Employment).</text></svg>
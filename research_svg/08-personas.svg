<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2080" viewBox="0 0 1440 2080"><defs><linearGradient id="bg08personassvg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F4FAFF"/><stop offset="1" stop-color="#D8EBFB"/></linearGradient></defs>
<rect width="1440" height="2080" fill="url(#bg08personassvg)"/>
<rect x="90" y="90" width="217" height="48" rx="24.0" fill="rgba(255,255,255,0.6)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="118" y="118" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="4" fill="#14608F">07 — PERSONAS</text>
<text x="90" y="182" font-family="Fraunces, Georgia, serif" font-size="64" fill="#0B2E4E">The people on both sides</text>
<text x="90" y="274" font-family="IBM Plex Mono, monospace" font-size="25" fill="#2C5A80">Three hirers, three workers. Bhagat Singh is field-based; the rest are sample</text>
<text x="90" y="312" font-family="IBM Plex Mono, monospace" font-size="25" fill="#2C5A80">profiles built from the research patterns.</text>
<rect x="90" y="400" width="400" height="830" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="118" y="448" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">HIRER · FIELD-BASED</text>
<circle cx="152" cy="508" r="34" fill="#2E9BE6"/>
<text x="152" y="522" font-family="Fraunces, Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle">भ</text>
<text x="202" y="504" font-family="Fraunces, Georgia, serif" font-size="32" fill="#0B2E4E">Bhagat Singh</text>
<text x="202" y="532" font-family="IBM Plex Mono, monospace" font-size="15" fill="#5E87A8">39 · CANTEEN &amp; MESS · UMRI, HARYANA</text>
<text x="118" y="580" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">GOAL</text>
<text x="118" y="610.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Everyday meals and canteen</text>
<text x="118" y="637.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">orders served smoothly, no</text>
<text x="118" y="664.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">delay — under strict food</text>
<text x="118" y="691.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">regulations.</text>
<text x="118" y="740.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">BEHAVIOUR</text>
<text x="118" y="770.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Hires 15–20 workers through</text>
<text x="118" y="797.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">village word of mouth; travels</text>
<text x="118" y="824.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">to villages himself. Khata by</text>
<text x="118" y="851.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">him or his brother.</text>
<text x="118" y="900.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">FRUSTRATION</text>
<text x="118" y="930.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Hiring is a gamble — sometimes</text>
<text x="118" y="957.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">the canteen runs short-staffed.</text>
<text x="118" y="984.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">New hires are strangers: no</text>
<text x="118" y="1011.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">verification.</text>
<text x="118" y="1060.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">WHAT THE SYSTEM GIVES</text>
<text x="118" y="1090.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Verified workers with ratings</text>
<text x="118" y="1117.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">on his phone; attendance logs</text>
<text x="118" y="1144.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">that end khata disputes.</text>
<rect x="530" y="400" width="400" height="830" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="558" y="448" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">HIRER · SAMPLE</text>
<circle cx="592" cy="508" r="34" fill="#2E9BE6"/>
<text x="592" y="522" font-family="Fraunces, Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle">मी</text>
<text x="642" y="504" font-family="Fraunces, Georgia, serif" font-size="32" fill="#0B2E4E">Meera Sharma</text>
<text x="642" y="532" font-family="IBM Plex Mono, monospace" font-size="15" fill="#5E87A8">44 · HOUSEHOLD EMPLOYER · SOUTH DELHI</text>
<text x="558" y="580" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">GOAL</text>
<text x="558" y="610.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Reliable domestic help she can</text>
<text x="558" y="637.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">trust inside her home, six days</text>
<text x="558" y="664.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">a week.</text>
<text x="558" y="713.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">BEHAVIOUR</text>
<text x="558" y="743.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Asks neighbours; tries agencies</text>
<text x="558" y="770.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">that charge a month’s salary as</text>
<text x="558" y="797.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">commission. Every agency worker</text>
<text x="558" y="824.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">quits within weeks.</text>
<text x="558" y="873.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">FRUSTRATION</text>
<text x="558" y="903.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Safety fears with strangers at</text>
<text x="558" y="930.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">home; no way to check a</text>
<text x="558" y="957.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">worker’s history; agency fees,</text>
<text x="558" y="984.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">zero accountability.</text>
<text x="558" y="1033.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">WHAT THE SYSTEM GIVES</text>
<text x="558" y="1063.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Verified profiles with</text>
<text x="558" y="1090.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">source-stated badges and</text>
<text x="558" y="1117.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">bidirectional ratings.</text>
<rect x="970" y="400" width="400" height="830" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="998" y="448" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">HIRER · SAMPLE</text>
<circle cx="1032" cy="508" r="34" fill="#2E9BE6"/>
<text x="1032" y="522" font-family="Fraunces, Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle">ब</text>
<text x="1082" y="504" font-family="Fraunces, Georgia, serif" font-size="32" fill="#0B2E4E">Balraj Yadav</text>
<text x="1082" y="532" font-family="IBM Plex Mono, monospace" font-size="15" fill="#5E87A8">51 · BUILDING CONTRACTOR · NOIDA</text>
<text x="998" y="580" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">GOAL</text>
<text x="998" y="610.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">8–12 site workers on day one of</text>
<text x="998" y="637.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">every project — without losing</text>
<text x="998" y="664.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">a week assembling a crew.</text>
<text x="998" y="713.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">BEHAVIOUR</text>
<text x="998" y="743.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Hires through mistri referrals</text>
<text x="998" y="770.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">and the morning labour chowk.</text>
<text x="998" y="797.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Attendance on a paper register;</text>
<text x="998" y="824.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">cash on memory.</text>
<text x="998" y="873.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">FRUSTRATION</text>
<text x="998" y="903.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Workers don’t show up, no</text>
<text x="998" y="930.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">backup list. Wage disputes with</text>
<text x="998" y="957.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">no record poison the next</text>
<text x="998" y="984.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">project’s hiring.</text>
<text x="998" y="1033.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">WHAT THE SYSTEM GIVES</text>
<text x="998" y="1063.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">One post reaches kiosks across</text>
<text x="998" y="1090.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">hotspots; attendance logs both</text>
<text x="998" y="1117.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">sides can see.</text>
<rect x="90" y="1266" width="400" height="830" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="118" y="1314" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">WORKER · SAMPLE</text>
<circle cx="152" cy="1374" r="34" fill="#2D9C6E"/>
<text x="152" y="1388" font-family="Fraunces, Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle">सु</text>
<text x="202" y="1370" font-family="Fraunces, Georgia, serif" font-size="32" fill="#0B2E4E">Sunita Devi</text>
<text x="202" y="1398" font-family="IBM Plex Mono, monospace" font-size="15" fill="#5E87A8">38 · DOMESTIC WORKER · DELHI</text>
<text x="118" y="1446" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">GOAL</text>
<text x="118" y="1476.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Steady monthly work in 3–4</text>
<text x="118" y="1503.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">houses — enough to keep her</text>
<text x="118" y="1530.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">children in school.</text>
<text x="118" y="1579.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">BEHAVIOUR</text>
<text x="118" y="1609.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Finds work through neighbours.</text>
<text x="118" y="1636.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">No phone of her own — uses her</text>
<text x="118" y="1663.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">husband’s; Hindi and voice</text>
<text x="118" y="1690.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">notes only.</text>
<text x="118" y="1739.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">FRUSTRATION</text>
<text x="118" y="1769.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">When a house drops her, income</text>
<text x="118" y="1796.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">stops with no notice. Years of</text>
<text x="118" y="1823.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">good work leave no trace.</text>
<text x="118" y="1872.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">WHAT THE SYSTEM GIVES</text>
<text x="118" y="1902.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">A portable reputation that</text>
<text x="118" y="1929.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">travels with her; jobs by voice</text>
<text x="118" y="1956.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">at a kiosk, confirmed by SMS.</text>
<rect x="530" y="1266" width="400" height="830" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="558" y="1314" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">WORKER · SAMPLE</text>
<circle cx="592" cy="1374" r="34" fill="#2D9C6E"/>
<text x="592" y="1388" font-family="Fraunces, Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle">र</text>
<text x="642" y="1370" font-family="Fraunces, Georgia, serif" font-size="32" fill="#0B2E4E">Ramesh Kumar</text>
<text x="642" y="1398" font-family="IBM Plex Mono, monospace" font-size="15" fill="#5E87A8">34 · CONSTRUCTION WORKER · BIHAR → DELHI</text>
<text x="558" y="1446" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">GOAL</text>
<text x="558" y="1476.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Daily wages without the daily</text>
<text x="558" y="1503.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">uncertainty — know the night</text>
<text x="558" y="1530.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">before whether tomorrow pays.</text>
<text x="558" y="1579.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">BEHAVIOUR</text>
<text x="558" y="1609.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Gathers at the labour chowk at</text>
<text x="558" y="1636.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">dawn; waits to be picked. Basic</text>
<text x="558" y="1663.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">keypad phone, no data.</text>
<text x="558" y="1712.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">FRUSTRATION</text>
<text x="558" y="1742.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">The wait itself is the tax —</text>
<text x="558" y="1769.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">hours unpaid, every morning.</text>
<text x="558" y="1796.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Past contractors can’t find him</text>
<text x="558" y="1823.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">again.</text>
<text x="558" y="1872.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">WHAT THE SYSTEM GIVES</text>
<text x="558" y="1902.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Job cards with pay, distance</text>
<text x="558" y="1929.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">and start time the evening</text>
<text x="558" y="1956.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">before; a token that holds his</text>
<text x="558" y="1983.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">place.</text>
<rect x="970" y="1266" width="400" height="830" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="998" y="1314" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">WORKER · SAMPLE</text>
<circle cx="1032" cy="1374" r="34" fill="#2D9C6E"/>
<text x="1032" y="1388" font-family="Fraunces, Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle">इ</text>
<text x="1082" y="1370" font-family="Fraunces, Georgia, serif" font-size="32" fill="#0B2E4E">Imran Sheikh</text>
<text x="1082" y="1398" font-family="IBM Plex Mono, monospace" font-size="15" fill="#5E87A8">27 · DRIVER / DELIVERY · DELHI</text>
<text x="998" y="1446" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">GOAL</text>
<text x="998" y="1476.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Trade gig fluctuations for one</text>
<text x="998" y="1503.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">steady monthly driving or</text>
<text x="998" y="1530.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">delivery job.</text>
<text x="998" y="1579.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">BEHAVIOUR</text>
<text x="998" y="1609.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Basic smartphone but rations</text>
<text x="998" y="1636.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">mobile data; juggles two gig</text>
<text x="998" y="1663.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">apps. Asks at auto stands about</text>
<text x="998" y="1690.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">openings.</text>
<text x="998" y="1739.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">FRUSTRATION</text>
<text x="998" y="1769.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">Gig ratings don’t transfer —</text>
<text x="998" y="1796.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">4.8 stars on an app means</text>
<text x="998" y="1823.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">nothing to a canteen owner</text>
<text x="998" y="1850.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">hiring a driver.</text>
<text x="998" y="1899.0" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3.5" fill="#14608F">WHAT THE SYSTEM GIVES</text>
<text x="998" y="1929.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">One verified identity and</text>
<text x="998" y="1956.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">portable ratings any hirer on</text>
<text x="998" y="1983.0" font-family="IBM Plex Mono, monospace" font-size="18" fill="#2C5A80">the system can read.</text></svg>
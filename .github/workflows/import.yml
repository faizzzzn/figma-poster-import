name: import-poster-to-figma

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: "Name for the new Figma file"
        default: "Sidhi Maternal Deaths — 53 in a year (Sem 7)"
      team_hint:
        description: "Team/project to create the file in (fallback: Drafts)"
        default: "Semester 7"
      svg_file:
        description: "Poster SVG file in the repo to import"
        default: "sidhi_maternal_deaths.svg"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Import poster into Figma
        env:
          FIGMA_EMAIL: ${{ secrets.FIGMA_EMAIL }}
          FIGMA_PASSWORD: ${{ secrets.FIGMA_PASSWORD }}
        run: |
          python import_poster.py \
            --svg "${{ inputs.svg_file }}" \
            --name "${{ inputs.file_name }}" \
            --team-hint "${{ inputs.team_hint }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-import-shots
          path: shots/

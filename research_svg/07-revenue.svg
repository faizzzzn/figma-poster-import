<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1450" viewBox="0 0 1440 1450"><defs><linearGradient id="bg07revenuesvg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F4FAFF"/><stop offset="1" stop-color="#D8EBFB"/></linearGradient></defs>
<rect width="1440" height="1450" fill="url(#bg07revenuesvg)"/>
<rect x="90" y="90" width="279" height="48" rx="24.0" fill="rgba(255,255,255,0.6)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="118" y="118" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="4" fill="#14608F">06 — REVENUE MODEL</text>
<text x="90" y="182" font-family="Fraunces, Georgia, serif" font-size="64" fill="#0B2E4E">How it sustains itself</text>
<text x="90" y="274" font-family="IBM Plex Mono, monospace" font-size="25" fill="#2C5A80">One rule shapes every revenue line: the worker never pays. Money comes from</text>
<text x="90" y="312" font-family="IBM Plex Mono, monospace" font-size="25" fill="#2C5A80">hirers, sponsors, and institutions — the sides with budget.</text>
<rect x="90" y="400" width="610" height="260" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="118" y="452" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">REVENUE 01</text>
<text x="118" y="502" font-family="Fraunces, Georgia, serif" font-size="34" fill="#0B2E4E">Hirer placement fee</text>
<text x="118" y="544.0" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">Posting is free; a small fee lands on a</text>
<text x="118" y="572.5" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">successful hire — or a monthly plan for</text>
<text x="118" y="601.0" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">contractors hiring crew after crew.</text>
<rect x="740" y="400" width="610" height="260" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="768" y="452" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">REVENUE 02</text>
<text x="768" y="502" font-family="Fraunces, Georgia, serif" font-size="34" fill="#0B2E4E">Paid verification add-ons</text>
<text x="768" y="544.0" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">Police-linked verification and certified skill</text>
<text x="768" y="572.5" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">tags as premium checks, bought by hirers who</text>
<text x="768" y="601.0" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">want extra assurance.</text>
<rect x="90" y="696" width="610" height="260" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="118" y="748" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">REVENUE 03</text>
<text x="118" y="798" font-family="Fraunces, Georgia, serif" font-size="34" fill="#0B2E4E">Sponsored skill courses</text>
<text x="118" y="840.0" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">Training partners, NSDC-aligned bodies and CSR</text>
<text x="118" y="868.5" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">funds sponsor Skill India courses — they pay for</text>
<text x="118" y="897.0" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">a pipeline of verified workers.</text>
<rect x="740" y="696" width="610" height="260" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="768" y="748" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">REVENUE 04</text>
<text x="768" y="798" font-family="Fraunces, Georgia, serif" font-size="34" fill="#0B2E4E">Kiosk sponsorship</text>
<text x="768" y="840.0" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">Kiosks at bus stands and stations carry sponsor</text>
<text x="768" y="868.5" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">branding — CSR money from companies that already</text>
<text x="768" y="897.0" font-family="IBM Plex Mono, monospace" font-size="19" fill="#2C5A80">spend on livelihoods.</text>
<rect x="90" y="1002" width="1260" height="230" rx="26" fill="rgba(255,255,255,0.72)" stroke="#82B9E6" stroke-width="1.5"/>
<text x="130" y="1056" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3.5" fill="#14608F">REVENUE 05 — INSTITUTIONAL</text>
<text x="130" y="1112.0" font-family="Fraunces, Georgia, serif" font-size="26" fill="#0B2E4E">Service fees from government partnership — e-Shram onboarding and state</text>
<text x="130" y="1151.0" font-family="Fraunces, Georgia, serif" font-size="26" fill="#0B2E4E">labour-department integrations, paid per worker brought into the formal fold.</text></svg>
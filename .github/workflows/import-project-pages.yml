name: import-project-pages-to-figma

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: "Name for the new Figma file"
        default: "Faizan Haidri — Project Pages"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (Pillow, Playwright + Chromium)
        run: |
          pip install pillow playwright
          python -m playwright install chromium --with-deps

      - name: Generate project-page artboards (5 case studies, desktop)
        run: |
          python build_portfolio_v7_exact.py --out website_svg_project_pages --only "case-"
          rm -f website_svg_project_pages/*-mobile.svg
          ls -la website_svg_project_pages/

      - name: Import project pages into Figma
        env:
          FIGMA_EMAIL: ${{ secrets.FIGMA_EMAIL }}
          FIGMA_PASSWORD: ${{ secrets.FIGMA_PASSWORD }}
          # fast viewport-pan placement (5 artboards); 0 = legacy nudge
          PASTE_STRIDE_PX: "2000"
        run: |
          python import_research.py \
            --svgs website_svg_project_pages \
            --name "${{ inputs.file_name }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-project-pages-import-shots
          path: shots/
